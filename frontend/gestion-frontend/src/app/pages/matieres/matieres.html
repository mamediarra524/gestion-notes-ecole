<div class="matieres-container">


  <!-- RETOUR DASHBOARD -->

  <a 
  routerLink="/dashboard" 
  class="back-btn">

    ⬅ Retour Dashboard

  </a>





  <h1>
    📚 Gestion des matières
  </h1>





  <!-- MESSAGE -->

  <p 
  *ngIf="message"
  class="message">

    {{message}}

  </p>









  <!-- FORMULAIRE -->

  <div class="form-card">


    <h2>

      {{ modification ? 
      'Modifier une matière' : 
      'Ajouter une matière' }}

    </h2>





    <form
    (ngSubmit)="modification ? enregistrerModification() : ajouterMatiere()"
    >





      <label>

        Nom de la matière

      </label>





      <input

      type="text"

      [(ngModel)]="matiere.nom"

      name="nom"

      placeholder="Exemple : Mathématiques"

      required>







      <button
      type="submit"
      class="btn-save">


        {{ modification ? 
        'Modifier' : 
        'Ajouter' }}


      </button>







      <button

      type="button"

      class="btn-cancel"

      *ngIf="modification"

      (click)="resetForm()">


        Annuler


      </button>





    </form>


  </div>









  <!-- RECHERCHE -->



  <div class="search-box">


    <label>

      🔎 Rechercher une matière :

    </label>





    <input

    type="text"

    [(ngModel)]="recherche"

    (input)="rechercher()"

    name="recherche"

    placeholder="Mathématiques..."

    >



  </div>









  <!-- TABLEAU -->


  <div class="table-card">


    <h2>
      Liste des matières
    </h2>





    <table>


      <thead>


        <tr>


          <th>
            ID
          </th>


          <th>
            Matière
          </th>


          <th>
            Actions
          </th>


        </tr>


      </thead>







      <tbody>


        <tr
        *ngFor="let matiere of matieresFiltrees">





          <td>

            {{matiere.id}}

          </td>







          <td>

            {{matiere.nom}}

          </td>







          <td>



            <button

            class="edit"

            (click)="modifier(matiere)">


              ✏️ Modifier


            </button>








            <button

            class="delete"

            (click)="supprimer(matiere.id)">


              🗑 Supprimer


            </button>





          </td>





        </tr>









        <tr
        *ngIf="matieresFiltrees.length === 0">


          <td colspan="3">


            Aucune matière trouvée


          </td>


        </tr>





      </tbody>


    </table>



  </div>









  <!-- PAGINATION -->


  <div class="pagination">


    <button

    (click)="pagePrecedente()"

    [disabled]="page === 1">


      ⬅ Précédent


    </button>







    <span>

      Page {{page}} / {{totalPages}}

    </span>







    <button

    (click)="pageSuivante()"

    [disabled]="page === totalPages">


      Suivant ➡


    </button>



  </div>






</div>
