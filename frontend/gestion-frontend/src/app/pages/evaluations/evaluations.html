<div class="evaluations-container">


<button routerLink="/dashboard">

⬅ Dashboard

</button>



<h1>
📝 Gestion des évaluations
</h1>



<p>

{{message}}

</p>





<h2>

Ajouter une évaluation

</h2>





<label>

Matière :

</label>



<select

[(ngModel)]="evaluation.matiere_id"

name="matiere_id"

>


<option value="">

Choisir une matière

</option>



<option

*ngFor="let m of matieres"

[value]="m.id"

>

{{m.nom}}

</option>


</select>








<label>

Libellé :

</label>


<input

type="text"

[(ngModel)]="evaluation.libelle"

name="libelle"

placeholder="Exemple : Devoir 1"

>








<label>

Date :

</label>


<input

type="date"

[(ngModel)]="evaluation.date"

name="date"

>








<label>

Coefficient :

</label>


<input

type="number"

[(ngModel)]="evaluation.coefficient"

name="coefficient"

min="1"

max="10"

>









<button

*ngIf="!modification"

(click)="ajouterEvaluation()"

>

Ajouter

</button>





<button

*ngIf="modification"

(click)="enregistrerModification()"

>

Modifier

</button>







<hr>







<h2>

Liste des évaluations

</h2>






<table>


<thead>


<tr>


<th>

Matière

</th>


<th>

Libellé

</th>


<th>

Date

</th>


<th>

Coefficient

</th>


<th>

Actions

</th>


</tr>


</thead>







<tbody>



<tr

*ngFor="let e of evaluations"

>


<td>

{{e.matiere?.nom}}

</td>



<td>

{{e.libelle}}

</td>



<td>

{{e.date}}

</td>



<td>

{{e.coefficient}}

</td>



<td>


<button

(click)="modifier(e)"

>

✏️ Modifier

</button>



<button

(click)="supprimer(e.id)"

>

🗑 Supprimer

</button>


</td>



</tr>



</tbody>



</table>





</div>
