services:

  postgres:
    image: postgres:16
    container_name: edugestion-postgres

    environment:
      POSTGRES_DB: gestion_notes_ecole
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:

  postgres_data: