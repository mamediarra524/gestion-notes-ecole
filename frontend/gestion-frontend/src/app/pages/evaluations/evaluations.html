<div class="evaluations-container">



  <!-- RETOUR DASHBOARD -->

  <button

    type="button"

    class="back-btn"

    (click)="retourDashboard()">

    ⬅ Retour Dashboard

  </button>





  <h1>
    📝 Gestion des évaluations
  </h1>





  <p

    *ngIf="message"

    class="message">

    {{message}}

  </p>









  <!-- FORMULAIRE -->

  <div

    #formulaire

    class="formulaire">





    <h2>

      {{ modification ? 'Modifier une évaluation' : 'Ajouter une évaluation' }}

    </h2>








    <label>

      Matière :

    </label>



    <select

      [(ngModel)]="evaluation.matiere_id"

      name="matiere_id">


      <option [value]="">

        Choisir une matière

      </option>




      <option

        *ngFor="let m of matieres"

        [value]="m.id">


        {{m.nom}}


      </option>



    </select>









    <label>

      Libellé :

    </label>


    <input

      type="text"

      [(ngModel)]="evaluation.libelle"

      name="libelle"

      placeholder="Exemple : Devoir 1">

    









    <label>

      Date :

    </label>


    <input

      type="date"

      [(ngModel)]="evaluation.date"

      name="date">

    









    <label>

      Coefficient :

    </label>


    <input

      type="number"

      [(ngModel)]="evaluation.coefficient"

      name="coefficient"

      min="1"

      max="10">

    









    <button

      *ngIf="!modification"

      type="button"

      class="save-btn"

      (click)="ajouterEvaluation()">

      ➕ Ajouter

    </button>








    <button

      *ngIf="modification"

      type="button"

      class="save-btn"

      (click)="enregistrerModification()">

      💾 Modifier

    </button>








    <button

      *ngIf="modification"

      type="button"

      class="cancel-btn"

      (click)="resetForm()">

      ❌ Annuler

    </button>



  </div>









  <hr>








  <h2>

    Liste des évaluations

  </h2>







  <table>


    <thead>


      <tr>


        <th>
          Matière
        </th>


        <th>
          Libellé
        </th>


        <th>
          Date
        </th>


        <th>
          Coefficient
        </th>


        <th>
          Actions
        </th>


      </tr>


    </thead>







    <tbody>



      <tr

        *ngFor="let e of evaluations">


        <td>

          {{e.matiere?.nom}}

        </td>



        <td>

          {{e.libelle}}

        </td>



        <td>

          {{e.date}}

        </td>



        <td>

          {{e.coefficient}}

        </td>



        <td>



          <button

            type="button"

            class="edit-btn"

            (click)="modifier(e)">


            ✏️ Modifier


          </button>






          <button

            type="button"

            class="delete-btn"

            (click)="supprimer(e.id)">


            🗑 Supprimer


          </button>



        </td>



      </tr>



    </tbody>



  </table>





</div>
