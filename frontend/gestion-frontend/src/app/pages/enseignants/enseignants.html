<div class="enseignants-container">


<a 
routerLink="/dashboard"
class="back-btn">

⬅ Retour Dashboard

</a>





<h1>
👨‍🏫 Gestion des enseignants
</h1>





<p 
*ngIf="message"
class="message">

{{message}}

</p>








<!-- FORMULAIRE -->


<div class="form-card">


<h2>

{{ modification ? 
'Modifier un enseignant' :
'Ajouter un enseignant'}}

</h2>





<form
(ngSubmit)="modification ? enregistrerModification() : ajouterEnseignant()">


<label>
Nom
</label>


<input

type="text"

[(ngModel)]="enseignant.nom"

name="nom"

required>



<label>
Prénom
</label>


<input

type="text"

[(ngModel)]="enseignant.prenom"

name="prenom"

required>



<label>
Email
</label>


<input

type="email"

[(ngModel)]="enseignant.email"

name="email"

required>



<label>
Téléphone
</label>


<input

type="text"

[(ngModel)]="enseignant.telephone"

name="telephone">






<button 
type="submit"
class="btn-save">


{{ modification ?
'Modifier' :
'Ajouter'}}


</button>






<button

type="button"

class="btn-cancel"

*ngIf="modification"

(click)="resetForm()">


Annuler


</button>





</form>


</div>









<!-- RECHERCHE -->


<div class="search-box">


<label>

🔎 Rechercher :

</label>



<input

type="text"

[(ngModel)]="recherche"

placeholder="Nom, prénom ou email">


</div>









<!-- TABLEAU -->


<div class="table-card">


<table>


<thead>

<tr>

<th>ID</th>

<th>Nom</th>

<th>Prénom</th>

<th>Email</th>

<th>Téléphone</th>

<th>Actions</th>


</tr>

</thead>





<tbody>


<tr 
*ngFor="let e of enseignantsFiltres">


<td>

{{e.id}}

</td>



<td>

{{e.nom}}

</td>



<td>

{{e.prenom}}

</td>



<td>

{{e.email}}

</td>



<td>

{{e.telephone}}

</td>





<td>


<button

class="edit"

(click)="modifier(e)">

✏️ Modifier

</button>





<button

class="delete"

(click)="supprimer(e.id)">

🗑 Supprimer

</button>


</td>


</tr>







<tr 
*ngIf="enseignantsFiltres.length===0">


<td colspan="6">

Aucun enseignant trouvé

</td>


</tr>



</tbody>



</table>


</div>









<!-- PAGINATION -->


<div class="pagination">


<button

(click)="pagePrecedente()"

[disabled]="page===1">

⬅ Précédent

</button>





<span>

Page {{page}} / {{totalPages}}

</span>





<button

(click)="pageSuivante()"

[disabled]="page===totalPages">

Suivant ➡

</button>



</div>




</div>
