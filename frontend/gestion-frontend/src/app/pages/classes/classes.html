<div class="classes-container">


  <!-- Retour Dashboard -->

  <a routerLink="/dashboard" class="back-btn">

    ⬅ Retour Dashboard

  </a>




  <h1>
    Gestion des classes
  </h1>



  <p *ngIf="message" class="message">

    {{ message }}

  </p>





  <!-- Formulaire -->


  <div class="form-card">


    <h2>

      {{ modification ? 'Modifier une classe' : 'Ajouter une classe' }}

    </h2>



    <form
      (ngSubmit)="modification ? enregistrerModification() : ajouterClasse()"
    >



      <div class="form-group">


        <label>
          Nom de la classe
        </label>


        <input

          type="text"

          [(ngModel)]="classe.nom"

          name="nom"

          placeholder="Exemple : 6ème A"

          required

        >


      </div>







      <div class="form-group">


        <label>
          Niveau
        </label>



        <input

          type="text"

          [(ngModel)]="classe.niveau"

          name="niveau"

          placeholder="Exemple : 6ème"

          required

        >


      </div>






      <button type="submit">


        {{ modification ? 'Modifier' : 'Ajouter' }}


      </button>





      <button

        type="button"

        *ngIf="modification"

        class="cancel"

        (click)="resetForm()"

      >

        Annuler

      </button>




    </form>


  </div>







  <!-- Recherche -->


  <div class="search-box">


    <label>
      Rechercher :
    </label>


    <input

      type="text"

      [(ngModel)]="recherche"

      placeholder="Nom ou niveau..."

    >


  </div>






  <p class="count">

    Nombre de classes :
    {{ classesFiltrees.length }}

  </p>









  <!-- Tableau -->


  <div class="table-card">


    <table>


      <thead>


        <tr>


          <th>
            ID
          </th>


          <th>
            Nom
          </th>


          <th>
            Niveau
          </th>


          <th>
            Actions
          </th>


        </tr>


      </thead>





      <tbody>



        <tr *ngFor="let classe of classesFiltrees">


          <td>

            {{ classe.id }}

          </td>




          <td>

            {{ classe.nom }}

          </td>




          <td>

            {{ classe.niveau }}

          </td>





          <td>


            <button

              class="edit"

              (click)="modifier(classe)"

            >

              ✏️ Modifier

            </button>





            <button

              class="delete"

              (click)="supprimer(classe.id)"

            >

              🗑 Supprimer

            </button>



          </td>



        </tr>






        <tr *ngIf="classesFiltrees.length === 0">


          <td colspan="4">

            Aucune classe trouvée

          </td>


        </tr>



      </tbody>


    </table>


  </div>



</div>
