<div class="classes-container">


  <!-- RETOUR DASHBOARD -->

  <button

    type="button"

    class="back-btn"

    (click)="retourDashboard()">


    ⬅ Retour Dashboard


  </button>





  <h1>
    Gestion des classes
  </h1>





  <!-- MESSAGE -->

  <p

    *ngIf="message"

    class="message">


    {{ message }}


  </p>









  <!-- FORMULAIRE -->


  <div class="form-card">


    <h2>


      {{ modification ? 'Modifier une classe' : 'Ajouter une classe' }}


    </h2>





    <form

      (ngSubmit)="modification ? enregistrerModification() : ajouterClasse()">






      <label>

        Nom de la classe

      </label>



      <input


        type="text"


        [(ngModel)]="classe.nom"


        name="nom"


        placeholder="Exemple : 6ème A"


        required>


    





      <label>

        Niveau

      </label>



      <input


        type="text"


        [(ngModel)]="classe.niveau"


        name="niveau"


        placeholder="Exemple : 6ème"


        required>








      <button

        type="submit"

        class="save-btn">


        {{ modification ? 'Modifier' : 'Ajouter' }}


      </button>








      <button


        type="button"


        class="cancel-btn"


        *ngIf="modification"


        (click)="resetForm()">



        Annuler



      </button>





    </form>


  </div>









  <!-- RECHERCHE -->


  <div class="search-box">


    <label>

      🔎 Rechercher une classe :

    </label>




    <input


      type="text"


      [(ngModel)]="recherche"


      (ngModelChange)="page=1; calculerPages()"


      placeholder="Nom ou niveau...">


  </div>








  <p class="count">


    Nombre de classes :

    {{ classesFiltrees.length }}


  </p>









  <!-- TABLEAU -->


  <div class="table-card">


    <table>


      <thead>


        <tr>


          <th>
            ID
          </th>


          <th>
            Nom
          </th>


          <th>
            Niveau
          </th>


          <th>
            Actions
          </th>


        </tr>


      </thead>







      <tbody>



        <tr

          *ngFor="let classe of classesPaginees">



          <td>

            {{ classe.id }}

          </td>





          <td>

            {{ classe.nom }}

          </td>





          <td>

            {{ classe.niveau }}

          </td>






          <td>



            <button


              class="edit"


              (click)="modifier(classe)">



              ✏️ Modifier



            </button>








            <button


              class="delete"


              (click)="supprimer(classe.id)">



              🗑 Supprimer



            </button>





          </td>



        </tr>









        <tr

          *ngIf="classesPaginees.length === 0">


          <td colspan="4">


            Aucune classe trouvée


          </td>


        </tr>





      </tbody>


    </table>


  </div>









  <!-- PAGINATION -->


  <div class="pagination">





    <button


      type="button"


      (click)="pagePrecedente()"


      [disabled]="page === 1">



      ⬅ Précédent



    </button>








    <span>


      Page {{ page }} / {{ totalPages }}


    </span>








    <button


      type="button"


      (click)="pageSuivante()"


      [disabled]="page === totalPages">



      Suivant ➡



    </button>





  </div>







</div>
